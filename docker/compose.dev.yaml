# 개발용 스택 — Postgres + backend. 학생 PC 의 compose(에이전트·workstation·Floci)는 서버가 학생마다
# 만들어 내려 주는 별개 파일이다.
#
#   docker compose -f docker/compose.dev.yaml up
#   docker compose -f docker/compose.dev.yaml run --rm backend pytest
#
# 공개 포트는 다른 프로젝트와 부딪히지 않게 비표준으로 잡았고 환경변수로 바꿀 수 있다
# (이 머신은 5432·6379·55432·58000·53000 대가 이미 쓰인다).
name: infralab-dev

x-postgres-env: &postgres-env
  POSTGRES_DB: infralab
  POSTGRES_USER: infralab
  POSTGRES_PASSWORD: infralab

services:
  db:
    image: postgres:18-alpine
    # 버릴 수 있는 dev DB — 커밋마다 fsync 를 기다리지 않는다.
    command: ["postgres", "-c", "synchronous_commit=off"]
    environment:
      <<: *postgres-env
    ports:
      - "${INFRALAB_DB_PORT:-55440}:5432"
    volumes:
      # 18 은 /var/lib/postgresql/18/docker 에 쓴다. 17 때 볼륨(infralab-dev-db)은 18 이 읽지 못해 새 이름을 쓴다.
      - infralab-dev-db18:/var/lib/postgresql
    healthcheck:
      # -h 를 준다 — 없으면 초기화 중 임시 서버가 유닉스 소켓에 응답해 TCP 가 열리기 전에 healthy 가 된다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U infralab -d infralab"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *postgres-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: dev-only-insecure-key-do-not-use-in-deploy
      DJANGO_ALLOWED_HOSTS: "*"
      # 로그인: DEBUG 라 개발용 로그인(POST /api/auth/dev-login)이 열린다. sandcorp-auth 로 직접 확인하려면
      # 개발 클라이언트 값을 준다(redirect_uri 는 DASHBOARD_ORIGIN 첫 값 + /api/auth/callback).
      INFRALAB_AUTH_URL: ${INFRALAB_AUTH_URL:-}
      INFRALAB_AUTH_CLIENT_ID: ${INFRALAB_AUTH_CLIENT_ID:-}
      INFRALAB_AUTH_CLIENT_SECRET: ${INFRALAB_AUTH_CLIENT_SECRET:-}
      SCENARIOS_DIR: /scenarios
      # 학생 compose.yml 에 들어가는 값. 이미지는 로컬 빌드 이름(docker build -t infralab/agent:dev agent/ 등).
      # compose 의 web 과, 호스트에서 `npm run dev` 로 직접 띄운 Vite(5173) 둘 다 허용한다.
      DASHBOARD_ORIGIN: http://127.0.0.1:${INFRALAB_WEB_PORT:-53040},http://127.0.0.1:5173
      AGENT_IMAGE: ${AGENT_IMAGE:-infralab/agent:dev}
      WORKSTATION_IMAGE: ${WORKSTATION_IMAGE:-infralab/workstation:dev}
      FLOCI_IMAGE: ${FLOCI_IMAGE:-floci/floci:2.3.0}
    ports:
      - "${INFRALAB_API_PORT:-58040}:8000"
    volumes:
      # 소스를 마운트해 코드 수정이 즉시 반영되게 한다. 가상환경은 /opt/venv 라 가려지지 않는다.
      - ../backend:/app
      # 시나리오 YAML 은 서버가 시작 때 읽는다 — 고치면 backend 를 재기동한다.
      - ../scenarios:/scenarios:ro
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  web:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      - backend
    environment:
      # Vite 개발 서버가 /api 를 이 주소로 넘긴다 — 브라우저는 web 오리진 하나만 본다.
      INFRALAB_API_PROXY: http://backend:8000
    ports:
      - "${INFRALAB_WEB_PORT:-53040}:5173"
    volumes:
      - ../web:/app
      # node_modules 는 호스트와 섞이지 않게 컨테이너 볼륨에 둔다(OS 별 바이너리).
      - infralab-dev-web-modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev"

volumes:
  infralab-dev-db18:
  infralab-dev-web-modules:
