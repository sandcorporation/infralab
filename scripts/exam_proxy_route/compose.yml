# 경로 시험(scripts/check_exam_proxy_route.sh): 운영 web 의 nginx.conf + 진짜 proxy(가짜 공급사 모드) + 가짜 backend.
# web 이미지는 Vite 빌드 없이 같은 nginx 기반 이미지에 web/nginx.conf 만 붙인다.
services:
  backend:
    image: python:3.13.18-slim-bookworm@sha256:a5a7017efc5969e00ae2b91c8eb0631049a569652aa4ffc4501769049ae45c72
    command: ["python", "-I", "/fake_backend.py"]
    volumes:
      - ./fake_backend.py:/fake_backend.py:ro
  proxy:
    build:
      context: ../../proxy
    environment:
      INFRALAB_EXAM_PROXY_SECRET: route-test-secret
      INFRALAB_PROXY_BACKEND_URL: http://backend:8000
      INFRALAB_PROXY_FAKE_PROVIDER: "1"
      INFRALAB_PROXY_TRUST_FORWARDED: "1"
      INFRALAB_PROXY_TOKEN_PER_MINUTE: "1"
      INFRALAB_PROXY_TOKEN_BURST: "30"
    profiles: [proxy]
  web:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes:
      - ../../web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1::8080"
