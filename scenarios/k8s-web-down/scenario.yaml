id: k8s-web-down
title: 응답하지 않는 web
description: |
  kind 클러스터에 Deployment `web` 과 Service `web` 이 있는데 `web` 이 응답하지 않는다.

  ## 할 일

  1. 원인을 찾는다.
  2. Service `web` 이 파드로 트래픽을 보내고, Deployment `web` 의 ready 레플리카가 2개 이상이 되게 고친다.

requires:
  floci: false
  kind:
    control_planes: 1
    workers: 2

setup: setup.sh
setup_timeout_seconds: 120

ai_rules: |
  파드 이미지는 인터넷에서 받는다. 파드가 Ready 가 될 때까지 `kubectl rollout status deployment/web` 으로 기다린다.

checks:
  - id: service-has-endpoints
    name: Service web 의 엔드포인트가 1개 이상
    hint: kubectl describe svc web 의 Selector 와 kubectl get pods --show-labels 의 라벨을 견준다
    command: kubectl get endpoints web -o jsonpath='{.subsets[*].addresses[*].ip}' | wc -w
    expect: { regex: "^\\s*[1-9]" }

  - id: deployment-ready
    name: Deployment web 의 ready 레플리카 2개 이상
    hint: kubectl scale deployment web --replicas=2
    command: n=$(kubectl get deploy web -o jsonpath='{.status.readyReplicas}'); echo "${n:-0}"
    expect: { regex: "^\\s*([2-9]|[1-9][0-9]+)\\s*$" }
    timeout_seconds: 90

  - id: deployment-not-recreated
    name: Deployment web 을 지우고 다시 만들지 않았다
    hint: 지우지 말고 kubectl edit / patch / scale 로 고친다
    command: check-web-kept.sh
    expect: exit_zero
    constraint: true

  - id: image-kept
    name: web 의 이미지가 nginx
    hint: 이미지는 바꾸지 않는다
    command: kubectl get deploy web -o jsonpath='{.spec.template.spec.containers[0].image}'
    expect: { regex: "^nginx(:|$)" }
    constraint: true
