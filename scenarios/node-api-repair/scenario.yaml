id: node-api-repair
title: 고장 난 Node API
description: |
  `/work/app` (호스트의 `./work/app`) 에 Express 로 만든 할 일 API 가 있다. 일부 동작이 틀린다.

  - `POST /sum` 에 빈 목록 `{"numbers": []}` 를 보내면 오류가 난다.
  - `GET /date` 가 `+09:00` 같은 시간대 오프셋을 반영하지 않는다.

  ## 할 일

  1. 증상을 재현하고 원인을 찾는다.
  2. 코드를 고쳐 테스트(`npm test`)가 모두 통과하게 한다.

  테스트 파일과 의존성(`package-lock.json`)은 바꾸지 않는다.

requires:
  floci: false
  kind: null

setup: setup.sh
setup_timeout_seconds: 240

ai_rules: |
  프로젝트는 `/work/app` 이다 (Express, 테스트는 jest).
  - 테스트: `cd /work/app && npm test`
  - 실행: `cd /work/app && npm start` (포트는 환경변수 PORT, 기본 3000)
  - `tests/` 와 `package-lock.json` 은 바꾸지 않는다. 의존성도 더하지 않는다.

checks:
  - id: tests-pass
    name: npm test 가 통과한다
    hint: cd /work/app && npm test 로 실패하는 테스트와 메시지를 본다
    command: cd /work/app && npm test 2>&1
    expect: exit_zero
    timeout_seconds: 120

  - id: service-responds
    name: 앱을 띄우면 /health 가 응답한다
    hint: cd /work/app && npm start 가 뜨는지 본다
    command: serve-and-curl.sh "node src/server.js" 3100 /health '"status":"ok"'
    expect: { contains: '"status":"ok"' }
    timeout_seconds: 60

  - id: tests-untouched
    name: tests/ 를 바꾸지 않았다
    hint: 테스트가 아니라 코드를 고친다 — 바뀐 파일은 출력에 보인다
    command: check-baseline.sh node-api-repair tests
    expect: exit_zero
    constraint: true

  - id: lock-untouched
    name: package-lock.json 을 바꾸지 않았다
    hint: 의존성을 더하거나 바꾸지 않는다 — 바뀐 파일은 출력에 보인다
    command: check-baseline.sh node-api-repair package-lock.json
    expect: exit_zero
    constraint: true
