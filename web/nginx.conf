# 운영 web 컨테이너(docker/web.Dockerfile)의 nginx 설정. TLS 는 바깥 리버스 프록시가 끝낸다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # compose 네트워크의 DNS 로 요청 때마다 backend 를 찾는다 — backend 가 늦게 뜨거나 교체돼도 nginx 는 그대로 뜬다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 바깥 프록시가 준 값을 그대로 넘긴다(없으면 이 연결의 scheme).
        set $fwd_proto $http_x_forwarded_proto;
        if ($fwd_proto = "") { set $fwd_proto $scheme; }
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
    }

    # 해시가 붙은 빌드 산출물은 오래 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 화면 경로(/cohorts/1 등)는 SPA 진입점으로.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
