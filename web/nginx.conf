# 운영 web 컨테이너(docker/web.Dockerfile)의 nginx 설정. TLS 는 바깥 리버스 프록시가 끝낸다.

# 지원자 IP: 바깥 리버스 프록시가 X-Forwarded-For 끝에 붙인 주소(지원자가 꾸민 앞쪽 값은 쓰지 않는다).
# 머리글이 없으면(바깥 프록시 없이 부름) 연결 주소.
map $http_x_forwarded_for $exam_client {
    "~(?:^|,)\s*(?<last>[^,\s]+)\s*$" $last;
    default $remote_addr;
}
# /exam-proxy/ 의 IP 별 요청 한도. 한 시험장(같은 공인 IP)의 여러 지원자를 함께 세므로 넉넉하게 —
# 임시 토큰별 한도는 proxy 가 따로 둔다(INFRALAB_PROXY_TOKEN_PER_MINUTE).
limit_req_zone $exam_client zone=exam_proxy_ip:10m rate=20r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # compose 네트워크의 DNS 로 요청 때마다 backend 를 찾는다 — backend 가 늦게 뜨거나 교체돼도 nginx 는 그대로 뜬다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 바깥 프록시가 준 값을 그대로 넘긴다(없으면 이 연결의 scheme).
        set $fwd_proto $http_x_forwarded_proto;
        if ($fwd_proto = "") { set $fwd_proto $scheme; }
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
    }

    # AI 프록시(proxy 서비스) — 지원자 PC 의 Claude Code·Codex 가 공개 주소 <도메인>/exam-proxy 로 부른다.
    # 접두어를 떼고 넘긴다: /exam-proxy/anthropic/v1/messages → proxy /anthropic/v1/messages.
    # proxy 가 없는 compose(개발)에서도 nginx 는 뜬다(요청 때 찾는다 — 그때만 502).
    location /exam-proxy/ {
        set $exam_proxy http://proxy:58090;
        rewrite ^/exam-proxy(/.*)$ $1 break;
        proxy_pass $exam_proxy;
        limit_req zone=exam_proxy_ip burst=200 nodelay;
        limit_req_status 429;
        # proxy 의 요청 본문 한도(maxRequestBody 32 MiB)와 맞춘다.
        client_max_body_size 32m;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # proxy 는 INFRALAB_PROXY_TRUST_FORWARDED=1 로 이 값(한 주소)을 client_id 로 쓴다.
        proxy_set_header X-Forwarded-For $exam_client;
        # 스트리밍(SSE) 응답을 조각마다 바로 흘린다. 긴 응답·생각 시간을 위해 넉넉히 기다린다.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 해시가 붙은 빌드 산출물은 오래 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 화면 경로(/cohorts/1 등)는 SPA 진입점으로.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
