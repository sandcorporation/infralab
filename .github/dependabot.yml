# 기반 이미지는 `이름:정확한버전@sha256:…` 로 고정한다(scripts/check_image_pins.sh 가 CI 에서 검사).
# 올릴 때는 이 PR 로 태그와 digest 를 함께 바꾼다. db 이미지가 바뀌면 배포 때 db 컨테이너가 한 번 다시 만들어진다.
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /docker
      - /docker/workstation
      - /agent
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
