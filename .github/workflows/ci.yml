# PR 검사. main push 에서는 release.yml 이 workflow_call 로 같은 검사를 부른다 — 통과해야 production 승격으로 간다.
name: ci

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  # PR 은 번호마다 새 push 가 옛 실행을 끊는다. main(workflow_call)은 커밋마다 따로 — 끊기면 그 sha 의 승격이 취소로 끝난다.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: infralab
          POSTGRES_USER: infralab
          POSTGRES_PASSWORD: infralab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U infralab -d infralab"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-insecure-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.13
        working-directory: backend
      - run: scripts/ci.sh backend

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/ci.sh web

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: scripts/ci.sh agent

  # 공개 주소 /exam-proxy → web(nginx) → proxy 경로·한도 시험(도커). web/nginx.conf·proxy/ 를 바꾸면 여기서 깨진다.
  exam-proxy-route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_exam_proxy_route.sh

  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci.sh factory
      - run: scripts/ci.sh release
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
