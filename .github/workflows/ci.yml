# PR 검사. main push 에서는 release.yml 이 workflow_call 로 같은 검사를 부른다 — 통과해야 production 승격으로 간다.
name: ci

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  # PR 은 번호마다 새 push 가 옛 실행을 끊는다. main(workflow_call)은 커밋마다 따로 — 끊기면 그 sha 의 승격이 취소로 끝난다.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: infralab
          POSTGRES_USER: infralab
          POSTGRES_PASSWORD: infralab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U infralab -d infralab"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-insecure-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.13
        working-directory: backend
      - run: scripts/ci.sh backend

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/ci.sh web

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: scripts/ci.sh agent

  # 공개 주소 /exam-proxy → web(nginx) → proxy 경로·한도 시험(도커). web/nginx.conf·proxy/ 를 바꾸면 여기서 깨진다.
  exam-proxy-route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_exam_proxy_route.sh

  # 브라우저 e2e(#168) — 개발 스택(dev-login) + 실제 에이전트·작은 workstation 을 띄워 Playwright 로 돈다.
  # 「사람 확인」으로 남던 화면·터미널 흐름(web/e2e/*.spec.ts)을 병합 전에 잡는다. `scripts/ci.sh all` 에는 넣지 않는다
  # (docker·7777 포트가 필요하다) — 공장 PR 도 GitHub App 토큰으로 만들어 이 잡이 돈다.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/ci.sh e2e
      # workstation 이미지는 크다 — 그 폴더를 바꾼 PR 만 빌드해 실제로 띄워 본다(#125: root·IS_SANDBOX·claude).
      - name: workstation 이미지 실행 시험
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(docker/workstation/|scripts/check_workstation_image\.sh$)'; then
            bash scripts/check_workstation_image.sh --build
          else
            echo "docker/workstation 변경 없음 — 건너뛴다(main 은 image.yml 이 올린 이미지로 돈다)"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: web/test-results/
          retention-days: 7

  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci.sh factory
      - run: scripts/ci.sh release
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
