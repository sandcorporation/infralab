# main push → 검사 → 이미지 → production 승격(#53). production 브랜치 머리 = 운영 버전.
# Jenkins 는 production push 만 보고, 굽지도 검사하지도 않고 그 sha 의 이미지를 받아 운영 서버에 배포한다
# (Jenkinsfile → jenkins-shared sandcorpDeploy deployFrom: 'production'). 흐름·서버 쪽 할 일은 docs/ops/deploy.md.
#
#   check   ci.yml(workflow_call) — PR 과 같은 backend·web·agent·factory·release 검사. 깨지면 승격이 없다.
#   image   check 와 나란히(서로 기다리지 않음). image.yml(workflow_call) — ghcr <이미지>:<sha>.
#           check 가 깨져도 그 sha 이미지는 ghcr 에 오를 수 있다 — 운영에 가는 길은 승격(둘 다 초록)뿐이다.
#   promote needs check·image. production 을 이 sha 로 fast-forward 만(scripts/promote.sh ff).
#           production 이 이미 더 새 판이면(옛 실행이 늦게 끝남) 실패가 아니라 건너뜀.
# production 은 앞으로만 간다. 되돌리기는 main 에 revert PR — 이 흐름을 그대로 탄다. 급하면 Jenkins ROLLBACK_SHA.
#
# 보안 규칙(공개 저장소):
#   - push: main 과 쓰기 권한자의 dispatch 만(승격은 main 일 때만). pull_request·pull_request_target 없음. GitHub 호스팅 실행기만. 다른 secrets 없음.
#   - 워크플로 기본 권한은 없음. check 는 contents: read, image 는 packages: write, contents: write 는 promote 잡에만.
#   - GITHUB_TOKEN 의 push 는 다른 워크플로를 깨우지 않는다(production push 로 Actions 가 다시 돌지 않는다).
#     저장소 웹훅(Jenkins githubPush)은 깨운다.
name: release

on:
  push:
    branches: [main]
  # 공장(Verify·Odin)은 GITHUB_TOKEN 으로 병합해 push 이벤트가 없다 — 병합 뒤 main 에 이 워크플로를 dispatch 한다.
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  promote:
    needs: [check, image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    # 승격이 겹치지 않게 저장소 전체에서 하나씩. 끊지 않고 줄 세운다.
    concurrency:
      group: production-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # production 이 이 sha 의 조상인지 보려면 이력이 있어야 한다
      - name: production fast-forward
        env:
          SHA: ${{ github.sha }}
        run: bash scripts/promote.sh ff "$SHA"
